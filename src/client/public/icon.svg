<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Pendolare">
  <title>Pendolare</title>
  <!-- The mark of the application: the icon `train-front` of Lucide, on the
       background of the board. Lucide holds the ISC licence, and the file
       README.md gives that note.

       The square holds the colour of the page. The mark then shows the train
       only on a surface of the application, and it shows the square on the tab
       of a browser with a light theme.

       Do not write two hyphens together in a comment of this file. XML stops at
       those two characters. -->
  <rect width="32" height="32" rx="7" fill="#0b0c0e"/>
  <g transform="translate(4 4)" fill="none" stroke="#f5a623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/>
    <path d="m9 15-1-1"/>
    <path d="m15 15 1-1"/>
    <path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/>
    <path d="m8 19-2 3"/>
    <path d="m16 19 2 3"/>
  </g>
</svg>
